var Q=[{"c": 0, "p": "1.1.4", "s": "Grand Horizon", "t": "q", "q": "<b>Léa</b> (réceptionniste) : Dans mes tableaux, je vois « marge brute » et « résultat ». Est-ce la même chose ?", "o": ["Non : le résultat se calcule avant le coût d’achat, la marge brute après", "Non : la marge brute = ventes HT − coût d’achat des marchandises ; le résultat = produits − toutes les charges (personnel, loyer, amortissements…)", "Oui, ce sont deux noms du même calcul", "Oui, mais le résultat est exprimé en % et la marge brute en euros"], "k": 1, "g": "Pas tout à fait. Combien de charges retire-t-on dans chaque calcul ?", "h": ["Combien de charges retire-t-on dans chaque calcul : une seule, ou toutes ?", "Marge brute = chiffre d’affaires HT − coût d’achat des marchandises (ou matières consommées) : elle ne déduit que cette charge. Résultat = produits − toutes les charges (personnel, loyer, énergie, amortissements, intérêts…). Exemple : marge brute 100 000 €, autres charges 80 000 € → résultat 20 000 €."], "m": "Marge brute ≠ résultat : la marge brute ne déduit que le coût d’achat ; le résultat déduit toutes les charges."}, {"c": 0, "p": "1.1.1", "s": "Grand Horizon", "t": "n", "q": "<b>Léa</b> (réceptionniste) : Une bouteille de vin est achetée 12 € HT et revendue 30 € HT. Quel est le coefficient multiplicateur ?", "a": 2.5, "tol": 0.1, "w": [], "g": "Pas tout à fait. Un peu de réflexion", "h": ["Coefficient multiplicateur = prix de vente unitaire : coût d'achat matières unitaire", "Coefficient multiplicateur = 30 ÷ 12 = 2,5. Le prix de vente représente 2,5 fois le coût d’achat."], "m": "Coefficient multiplicateur = prix de vente unitaire : coût d'achat matières unitaire"}, {"c": 0, "p": "1.1.1", "s": "Grand Horizon", "t": "n", "q": "<b>Léa</b> (réceptionniste) : Un fromage est acheté 8 € HT et revendu 14 € HT. Quel est le taux de marge (en %) ?", "a": 75.0, "tol": 0.5, "w": [], "g": "Pas tout à fait. Marge = prix de vente HT − coût d’achat HT ; le taux de marge se calcule sur le coût d’achat.", "h": ["Marge = prix de vente HT − coût d’achat HT ; le taux de marge se calcule sur le coût d’achat.", "Marge = 14 − 8 = 6 €. Taux de marge = 6 ÷ 8 × 100 = 75 %."], "m": "Taux de marge = marge ÷ coût d’achat HT."}, {"c": 0, "p": "1.1.1", "s": "Grand Horizon", "t": "n", "q": "<b>Léa</b> (réceptionniste) : Une bouteille de vin est achetée 12 € HT et revendue 30 € HT. Quel est le taux de marque (en %) ?", "a": 60.0, "tol": 0.5, "w": [], "g": "Pas tout à fait. Cette fois, on divise la marge par le prix de vente HT.", "h": ["Cette fois, on divise la marge par le prix de vente HT.", "Marge = 30 − 12 = 18 €. Taux de marque = 18 ÷ 30 × 100 = 60 %. Il est toujours inférieur à 100 %, contrairement au taux de marge (ici 150 %)."], "m": "Taux de marque = marge ÷ prix de vente HT."}, {"c": 0, "p": "1.1.4", "s": "Grand Horizon", "t": "n", "q": "<b>Léa</b> (réceptionniste) : Le restaurant réalise 120 000 € de chiffre d’affaires HT. Le coût d’achat des marchandises vendues est de 42 000 € et les autres charges (personnel, loyer, énergie…) de 50 000 €. Quelle est la marge brute (en €) ?", "a": 78000.0, "tol": 1.0, "w": [], "g": "Pas tout à fait. La marge brute ne déduit que le coût d’achat des marchandises.", "h": ["La marge brute ne déduit que le coût d’achat des marchandises.", "Marge brute = 120 000 − 42 000 = 78 000 €. Le résultat serait de 78 000 − 50 000 = 28 000 € : les autres charges ne sont pas dans la marge brute."], "m": "Marge brute = CA HT − coût d’achat des marchandises vendues."}, {"c": 1, "p": "1.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>Sofiane</b> (maître d’hôtel) : Un plat coûte 5 € de matières premières HT. Nous appliquons un coefficient multiplicateur de 4. Quel est le prix de vente HT (en €) ?", "a": 20.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. Prix de vente HT = coût matière × coefficient.", "h": ["Prix de vente HT = coût matière × coefficient.", "5 × 4 = 20 € HT."], "m": "Prix HT = coût × coefficient multiplicateur."}, {"c": 1, "p": "1.1.3", "s": "Grand Horizon", "t": "n", "q": "<b>Sofiane</b> (maître d’hôtel) : Ce plat est vendu 20 € HT. La restauration sur place est soumise à la TVA à 10 %. Quel prix TTC affiche-t-on sur la carte (en €) ?", "a": 22.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. TTC = HT × (1 + taux de TVA) = HT × 1,10.", "h": ["TTC = HT × (1 + taux de TVA) = HT × 1,10.", "20 × 1,10 = 22 € TTC (TVA : 2 €)."], "m": "TTC = HT × (1 + TVA)."}, {"c": 1, "p": "1.1.3", "s": "Grand Horizon", "t": "n", "q": "<b>Sofiane</b> (maître d’hôtel) : Un menu est affiché 33 € TTC (TVA à 10 %). Quel est son prix HT (en €) ?", "a": 30.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. HT = TTC ÷ (1 + taux de TVA).", "h": ["HT = TTC ÷ (1 + taux de TVA).", "33 ÷ 1,10 = 30 € HT. Piège : retirer 10 % de 33 donnerait 29,70 €, ce qui est faux."], "m": "HT = TTC ÷ (1 + TVA)."}, {"c": 1, "p": "1.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>Sofiane</b> (maître d’hôtel, au bar) : Un cocktail coûte 2 € de matières HT et se vend 12 € TTC (alcool, TVA à 20 %). Le coefficient multiplicateur est le rapport prix de vente TTC ÷ coût d’achat HT. Quel est-il ?", "a": 6.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. Divisez le prix TTC par le coût HT.", "h": ["Divisez le prix TTC par le coût HT.", "12 ÷ 2 = 6. Le prix HT est de 10 €, soit un coefficient HT de 5."], "m": "Coefficient (TTC) = prix TTC ÷ coût d’achat HT."}, {"c": 1, "p": "1.1.3", "s": "Grand Horizon", "t": "q", "q": "<b>Sofiane</b> (maître d’hôtel, au bar) : Quel taux de TVA s’applique à une nuitée d’hôtel en France métropolitaine (taux en vigueur en 2026) ?", "o": ["2,1 %", "20 %", "5,5 %", "10 %"], "k": 3, "g": "Pas tout à fait. C’est un taux intermédiaire, le même que pour la restauration sur place.", "h": ["C’est un taux intermédiaire, le même que pour la restauration sur place.", "Hébergement : 10 %. Restauration sur place : 10 %. Boissons alcoolisées : 20 %. Le taux de 2,1 % concerne la Corse."], "m": "Hébergement et restauration sur place : 10 % ; alcool : 20 %."}, {"c": 1, "p": "1.1.3", "s": "Grand Horizon", "t": "n", "q": "<b>Sofiane</b> (maître d’hôtel) : Un cocktail est vendu 12 € TTC (boissons alcoolisées, TVA à 20 %). Quel est son prix HT (en €) ?", "a": 10.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. HT = TTC ÷ (1 + taux de TVA).", "h": ["HT = TTC ÷ (1 + taux de TVA).", "12 ÷ 1,20 = 10 € HT (TVA : 2 €)."], "m": "HT = TTC ÷ (1 + TVA)."}, {"c": 1, "p": "1.1.2,1.1.3", "s": "Grand Horizon", "t": "n", "q": "<b>Sofiane</b> (maître d’hôtel) : Un plat coûte 7 € de matières. Le coefficient multiplicateur appliqué pour obtenir le prix HT est de 3,2. Avec une TVA à 10 %, quel prix TTC affiche-t-on sur la carte (en €) ?", "a": 24.64, "tol": 0.01, "w": [], "g": "Pas tout à fait. Prix HT = 7 × 3,2, puis TTC = HT × 1,10.", "h": ["Prix HT = 7 × 3,2, puis TTC = HT × 1,10.", "7 × 3,2 = 22,40 € HT ; 22,40 × 1,10 = 24,64 € TTC."], "m": "Prix HT = coût × coefficient ; TTC = HT × (1 + TVA)."}, {"c": 2, "p": "2.3.1", "s": "Grand Horizon", "t": "t", "q": "<b>Élodie</b> (cheffe de salle) : Voici le tableau de bord de la salle. Complétez la colonne N : retrouvez d’abord les formules grâce à la colonne N-1.", "tbl": {"head": ["Éléments", "N-1", "N"], "rows": [["Nombre de places", "80", "80"], ["Jours d’ouverture", "300", "300"], ["Services par jour", "2", "2"], ["Couverts possibles (places × jours × services)", "48 000", {"a": 48000.0, "tol": 1.0}], ["Couverts servis", "33 600", "36 000"], ["Taux de remplissage (%)", "70,00", {"a": 75.0, "tol": 0.05}], ["Chiffre d’affaires HT (€)", "873 600", "972 000"], ["Ticket moyen HT (€)", "26,00", {"a": 27.0, "tol": 0.01}], ["Taux de rotation (couverts par place et par jour)", "1,40", {"a": 1.5, "tol": 0.01}], ["Couverts par jour", "112", {"a": 120.0, "tol": 0.5}]]}, "h": ["Remplissage = couverts servis ÷ couverts possibles ; ticket moyen = CA ÷ couverts ; rotation = couverts ÷ (places × jours).", "Couverts possibles : 80 × 300 × 2 = 48 000. Remplissage : 36 000 ÷ 48 000 = 75 %. Ticket moyen : 972 000 ÷ 36 000 = 27 €. Rotation : 36 000 ÷ (80 × 300) = 1,5. Couverts par jour : 36 000 ÷ 300 = 120."], "m": "Remplissage = couverts servis ÷ couverts possibles ; ticket moyen = CA ÷ couverts ; rotation = couverts ÷ (places × jours)."}, {"c": 2, "p": "2.3.2", "s": "Grand Horizon", "t": "n", "q": "<b>Élodie</b> (cheffe de salle) : Le chiffre d’affaires HT passe de 873 600 € (N-1) à 972 000 € (N). Quelle est l’évolution (en %, arrondie au centième) ?", "a": 11.26, "tol": 0.02, "w": [], "g": "Pas tout à fait. Évolution = (CA N − CA N-1) ÷ CA N-1 × 100.", "h": ["Évolution = (CA N − CA N-1) ÷ CA N-1 × 100.", "(972 000 − 873 600) ÷ 873 600 × 100 = 11,26 %. Cette hausse vient surtout du nombre de couverts (+7,1 %) et du ticket moyen (+1 €)."], "m": "Évolution en % = (N − N-1) ÷ N-1 × 100."}, {"c": 2, "p": "2.3.3", "s": "Grand Horizon", "t": "t", "q": "<b>Élodie</b> (cheffe de salle) : Comparons N-1 et N. Complétez la colonne « Évolution » : en % pour un montant ou un volume, en points pour un taux.", "tbl": {"head": ["Indicateur", "N-1", "N", "Évolution"], "rows": [["Couverts servis", "33 600", "36 000", {"a": 7.14, "tol": 0.02, "u": "%"}], ["Ticket moyen HT (€)", "26,00", "27,00", {"a": 3.85, "tol": 0.02, "u": "%"}], ["Taux de remplissage (%)", "70,00", "75,00", {"a": 5.0, "tol": 0.05, "u": "points"}], ["Part des boissons dans le CA (%)", "28,00", "30,00", {"a": 2.0, "tol": 0.05, "u": "points"}]]}, "h": ["Évolution en % = (N − N-1) ÷ N-1 × 100 ; pour un taux, on fait simplement N − N-1 (en points).", "Couverts : (36 000 − 33 600) ÷ 33 600 = 7,14 %. Ticket moyen : (27 − 26) ÷ 26 = 3,85 %. Taux de remplissage : 75 − 70 = 5 points. Part des boissons : 30 − 28 = 2 points."], "m": "Montant ou volume : évolution en %. Taux : écart en points."}, {"c": 2, "p": "2.3.3", "s": "Grand Horizon", "t": "q", "q": "<b>Élodie</b> (cheffe de salle) : Le taux de remplissage passe de 70 % à 75 %. Quelle formulation est correcte ?", "o": ["Il augmente de 5 points, soit environ 7,14 %", "Il augmente de 5 %", "Il augmente de 5 points et de 5 %", "Il augmente de 7,14 points"], "k": 0, "g": "Pas tout à fait. Pour un taux, on mesure l’écart en points ; l’évolution relative se calcule ensuite.", "h": ["Pour un taux, on mesure l’écart en points ; l’évolution relative se calcule ensuite.", "Écart : 75 − 70 = 5 points. Évolution relative : 5 ÷ 70 = 7,14 %. On ne dit jamais « +5 % » pour passer de 70 % à 75 %."], "m": "Écart de taux = points ; évolution relative = écart ÷ taux de départ."}, {"c": 2, "p": "2.3.3", "s": "Grand Horizon", "t": "n", "q": "<b>Élodie</b> (cheffe de salle) : Le restaurant vise une hausse de 5 % de son chiffre d’affaires l’an prochain (N+1). Son CA de N est de 972 000 €. Quel CA vise-t-il (en €) ?", "a": 1020600.0, "tol": 1.0, "w": [], "g": "Pas tout à fait. CA N+1 = CA N × (1 + taux d’évolution) = CA N × 1,05.", "h": ["CA N+1 = CA N × (1 + taux d’évolution) = CA N × 1,05.", "972 000 × 1,05 = 1 020 600 €. Le coefficient multiplicateur d’une hausse de 5 % est 1,05."], "m": "CA N+1 = CA N × (1 + taux d’évolution)."}, {"c": 2, "p": "2.3.3", "s": "Grand Horizon", "t": "n", "q": "<b>Élodie</b> (cheffe de salle) : Le restaurant d’un hôtel voisin voit son chiffre d’affaires passer de 500 000 € à 460 000 €. Quelle est l’évolution (en %, avec son signe) ?", "a": -8.0, "tol": 0.05, "w": [], "g": "Pas tout à fait. Évolution = (CA final − CA initial) ÷ CA initial × 100. Une baisse donne un résultat négatif.", "h": ["Évolution = (CA final − CA initial) ÷ CA initial × 100. Une baisse donne un résultat négatif.", "(460 000 − 500 000) ÷ 500 000 × 100 = −8 %. Le CA recule de 8 %."], "m": "Évolution en % = (final − initial) ÷ initial × 100 ; négative en cas de baisse."}, {"c": 2, "p": "2.3.1", "s": "Grand Horizon", "t": "n", "q": "<b>Élodie</b> (cheffe de salle) : En N, le coût des matières consommées par le restaurant s’élève à 291 600 € pour un chiffre d’affaires HT de 972 000 €. Quel est le ratio coût matières (en %) ?", "a": 30.0, "tol": 0.1, "w": [], "g": "Pas tout à fait. Ratio = coût matières ÷ CA HT × 100.", "h": ["Ratio = coût matières ÷ CA HT × 100.", "291 600 ÷ 972 000 × 100 = 30 %. Au-delà du seuil fixé par la direction, on ajuste les prix ou les portions."], "m": "Ratio coût matières = coût matières ÷ CA HT."}, {"c": 2, "p": "2.3.1", "s": "Grand Horizon", "t": "n", "q": "<b>Élodie</b> (cheffe de salle) : Avec 120 couverts par jour en moyenne et un ticket moyen de 27 €, quel est le chiffre d’affaires HT journalier moyen (en €) ?", "a": 3240.0, "tol": 1.0, "w": [], "g": "Pas tout à fait. CA = couverts × ticket moyen.", "h": ["CA = couverts × ticket moyen.", "120 × 27 = 3 240 € par jour."], "m": "CA = couverts × ticket moyen."}, {"c": 2, "p": "2.3.4", "s": "Grand Horizon", "t": "r", "q": "<b>Élodie</b> (cheffe de salle) : ✍️ <b>Analysez</b> l’évolution de l’activité du restaurant entre N-1 et N (CA de 873 600 € à 972 000 €, couverts de 33 600 à 36 000, ticket moyen de 26 € à 27 €, taux de remplissage de 70 % à 75 %, part des boissons de 28 % à 30 %). Quelles sont les causes de la hausse du CA ? (4 à 6 phrases)", "crit": [["Constate l’évolution du chiffre d’affaires", "(ca |chiffre d affaires|hausse|augment|progress)"], ["Explique par les couverts (volume)", "(couvert|frequentation|volume)"], ["Explique par le ticket moyen (prix)", "(ticket)"], ["Cite le taux de remplissage ou les points gagnés", "(remplissage|point)"], ["Conclut ou recommande une action", "(recommand|propos|action|conclu|poursuivre|maintenir|continuer)"]], "model": "Le chiffre d’affaires du restaurant progresse de 11,26 % (873 600 € à 972 000 €). Cette hausse vient à la fois du volume, avec 7,14 % de couverts en plus et un taux de remplissage qui gagne 5 points (70 % à 75 %), et du prix, avec un ticket moyen en hausse de 3,85 % (26 € à 27 €). La part des boissons gagne 2 points, signe d’une meilleure vente additionnelle. Je recommande de poursuivre la montée en gamme tout en vérifiant que la rotation des tables ne dégrade pas la qualité du service.", "h": ["Cherchez ce qui vient du volume (couverts) et ce qui vient du prix (ticket moyen).", "Un bon commentaire : un constat chiffré, les causes (volume, prix), puis une recommandation."], "m": "Analyse = constat chiffré + causes + recommandation."}, {"c": 3, "p": "5.1.1", "s": "Grand Horizon", "t": "q", "q": "<b>Maître Garance</b> (juriste) : Un client réserve par téléphone un séminaire d’entreprise. Selon le Code civil (art. 1128), quelles sont les conditions de validité de ce contrat d’hôtellerie ?", "o": ["Un prix supérieur à 100 € et l’accord d’un notaire", "Un écrit signé devant témoins et un paiement d’avance", "Le consentement des parties, leur capacité de contracter et un contenu licite et certain", "Une durée minimale d’un an et une assurance annulation"], "k": 2, "g": "Pas tout à fait. Trois conditions : le consentement, la capacité et le contenu du contrat.", "h": ["Trois conditions : le consentement, la capacité et le contenu du contrat.", "Art. 1128 : consentement des parties, capacité de contracter, contenu licite et certain. Un écrit n’est en principe pas exigé : un contrat d’hôtellerie peut se former par téléphone, e-mail ou site de réservation."], "m": "Validité : consentement + capacité + contenu licite et certain."}, {"c": 3, "p": "5.1.2,5.1.3", "s": "Grand Horizon", "t": "q", "q": "<b>Maître Garance</b> (juriste) : Sur le site de l’hôtel, une chambre est présentée « vue mer avec balcon ». À l’arrivée, elle donne sur le parking et n’a pas de balcon : la photo provenait d’une autre chambre, ce que l’hôtelier savait. De quel vice du consentement s’agit-il ?", "o": ["L’erreur : le client s’est trompé seul, sans intervention de l’hôtelier", "Le dol : le client a été trompé par un mensonge intentionnel de l’hôtelier", "Aucun vice : l’appréciation d’une chambre est subjective", "La violence : l’hôtelier a exercé une contrainte sur le client"], "k": 1, "g": "Pas tout à fait. L’hôtelier savait que l’information était fausse : comment appelle-t-on une tromperie volontaire ?", "h": ["L’hôtelier savait que l’information était fausse : comment appelle-t-on une tromperie volontaire ?", "Dol (art. 1137) : le client a consenti à cause de fausses informations données volontairement (mensonge, photo trompeuse). Conditions : manœuvres ou mensonge, intention de tromper, caractère déterminant. Sanction : nullité et dommages-intérêts possibles."], "m": "Dol = manœuvres, mensonge ou dissimulation intentionnelle d’une information déterminante."}, {"c": 3, "p": "5.1.2", "s": "Grand Horizon", "t": "q", "q": "<b>Maître Garance</b> (juriste) : Un client réserve en ligne un séjour en pensant, à tort, que l’hôtel de montagne a une piscine. La page de réservation indique clairement « sans piscine », mais il ne l’a pas lue. L’hôtelier n’a rien dissimulé. Peut-il obtenir la nullité pour erreur ?", "o": ["Oui : toute erreur sur une qualité de l’hôtel entraîne la nullité", "Oui : l’hôtelier aurait dû vérifier que le client avait bien lu", "Non : une erreur ne peut jamais annuler un contrat d’hôtellerie", "Non : l’erreur porte sur une qualité essentielle mais elle est inexcusable (l’information était claire et accessible)"], "k": 3, "g": "Pas tout à fait. Une erreur n’annule le contrat que si elle est excusable : le client a-t-il été diligent ?", "h": ["Une erreur n’annule le contrat que si elle est excusable : le client a-t-il été diligent ?", "Art. 1132 : l’erreur sur les qualités essentielles est une cause de nullité, à moins qu’elle ne soit inexcusable. Ici l’information était claire : le client n’a pas été diligent, l’erreur est inexcusable et le contrat reste valable."], "m": "Erreur = qualités essentielles du service + excusable."}, {"c": 3, "p": "5.1.2", "s": "Grand Horizon", "t": "q", "q": "<b>Maître Garance</b> (juriste) : Un directeur d’hôtel menace de divulguer des informations privées sur le séjour d’un client si celui-ci ne signe pas un contrat de séminaire de 20 000 €. Le client signe. Quel vice du consentement est caractérisé ?", "o": ["La violence : le client s’engage sous la pression d’une menace", "Aucun vice : un contrat signé reste toujours valable", "L’erreur : le client s’est trompé sur le contrat", "Le dol : le client a été trompé par un mensonge"], "k": 0, "g": "Pas tout à fait. Le client n’a pas été trompé : il a été contraint.", "h": ["Le client n’a pas été trompé : il a été contraint.", "Violence (art. 1140) : le client s’engage sous la contrainte, par crainte d’un mal considérable. À noter : menacer d’une voie de droit légitime (poursuites pour un impayé réel) n’est pas une violence (art. 1141), sauf pour obtenir un avantage manifestement excessif."], "m": "Violence = contrainte qui inspire la crainte d’un mal considérable."}, {"c": 4, "p": "4.1.1", "s": "Grand Horizon", "t": "q", "q": "<b>Julie</b> (responsable des réservations) : Quelle est la différence essentielle entre les arrhes et l’acompte ?", "o": ["Les arrhes se versent uniquement en espèces", "Avec un acompte, chacun peut se dédire ; les arrhes engagent fermement", "Avec des arrhes, chacun peut se dédire (le client les perd, l’hôtel les restitue au double) ; l’acompte engage fermement les deux parties", "Il n’y a aucune différence"], "k": 2, "g": "Pas tout à fait. Posez-vous la question : peut-on se dédire ou non ?", "h": ["Posez-vous la question : peut-on se dédire ou non ?", "Arrhes : faculté de dédit (perte ou restitution au double). Acompte : paiement partiel d’un contrat ferme, le solde reste dû. Sauf mention contraire, une somme versée d’avance est considérée comme des arrhes (art. L. 214-1 du Code de la consommation)."], "m": "Arrhes = dédit possible ; acompte = engagement ferme."}, {"c": 4, "p": "4.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>Julie</b> (responsable des réservations) : Séjour de 3 nuits à 120 € TTC la nuit. Le client verse 30 % d’arrhes à la réservation, puis annule. Quel montant l’hôtel conserve-t-il (en €) ?", "a": 108.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. Prix du séjour × 30 %. Le client qui annule perd ses arrhes.", "h": ["Prix du séjour × 30 %. Le client qui annule perd ses arrhes.", "3 × 120 = 360 € ; 30 % = 108 €, conservés par l’hôtel. S’il s’agissait d’un acompte, le client resterait redevable du solde (252 €)."], "m": "Arrhes = % × prix du séjour ; le client qui annule les perd."}, {"c": 4, "p": "4.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>Julie</b> (responsable des réservations) : Un client réserve un séminaire de 5 000 € TTC avec un acompte de 30 %, puis annule. Le contrat étant ferme, quel solde reste-t-il redevable à l’hôtel (en €) ?", "a": 3500.0, "tol": 1.0, "w": [], "g": "Pas tout à fait. Un acompte engage fermement les deux parties : le solde reste dû. Calculez 5 000 − 30 %.", "h": ["Un acompte engage fermement les deux parties : le solde reste dû. Calculez 5 000 − 30 %.", "Acompte : 5 000 × 30 % = 1 500 €. Solde dû : 5 000 − 1 500 = 3 500 € (en principe, sous réserve des clauses du contrat). Avec des arrhes, le client aurait perdu 1 500 € et se serait libéré."], "m": "Acompte : engagement ferme, le solde reste dû ; arrhes : dédit possible."}, {"c": 4, "p": "4.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>Julie</b> (responsable des réservations) : L’hôtel annule lui-même un séjour pour lequel il avait reçu 108 € d’arrhes. Quel montant doit-il restituer au client (en €) ?", "a": 216.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. Si c’est celui qui a reçu les arrhes qui se dédit, il les restitue au double.", "h": ["Si c’est celui qui a reçu les arrhes qui se dédit, il les restitue au double.", "108 × 2 = 216 € (art. L. 214-1 du Code de la consommation)."], "m": "Arrhes : le client qui se dédit les perd ; le professionnel qui se dédit les restitue au double."}, {"c": 5, "p": "2.2.1", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : L’hôtel compte 60 chambres. En 30 jours, il a vendu 1 080 nuitées. Quel est le taux d’occupation (en %) ?", "a": 60.0, "tol": 0.1, "w": [], "g": "Pas tout à fait. Nuitées disponibles = 60 chambres × 30 jours.", "h": ["Nuitées disponibles = 60 chambres × 30 jours.", "1 080 ÷ (60 × 30) = 1 080 ÷ 1 800 = 60 %."], "m": "Taux d’occupation = nuitées vendues ÷ nuitées disponibles."}, {"c": 5, "p": "2.2.1", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : Le chiffre d’affaires hébergement HT du mois est de 108 000 €. Quel est le prix moyen par nuitée vendue (en €) ?", "a": 100.0, "tol": 0.1, "w": [], "g": "Pas tout à fait. Divisez le CA par les nuitées vendues (1 080).", "h": ["Divisez le CA par les nuitées vendues (1 080).", "108 000 ÷ 1 080 = 100 € HT."], "m": "Prix moyen = CA hébergement ÷ nuitées vendues."}, {"c": 5, "p": "2.2.1", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : Avec un CA de 108 000 € sur le mois, quel est le RevPAR (en €) ?", "a": 60.0, "tol": 0.1, "w": [], "g": "Pas tout à fait. Divisez le CA par les nuitées disponibles (1 800), et non vendues.", "h": ["Divisez le CA par les nuitées disponibles (1 800), et non vendues.", "108 000 ÷ 1 800 = 60 €. Vérification : taux d’occupation 60 % × prix moyen 100 € = 60 €."], "m": "RevPAR = CA ÷ nuitées disponibles = taux d’occupation × prix moyen."}, {"c": 5, "p": "2.2.1,2.2.2", "s": "Grand Horizon", "t": "t", "q": "<b>Nina</b> (revenue manager) : Voici le tableau de bord de l’hôtel. Complétez les cases vides de N : retrouvez d’abord les formules grâce à la colonne N-1.", "tbl": {"head": ["Éléments", "N-1", "N"], "rows": [["Nombre de chambres disponibles", "15 006", "15 006"], ["Nombre de chambres louées", "12 518", "12 488"], ["Taux d’occupation (%)", "83,42", {"a": 83.22, "tol": 0.01}], ["Nuitées", "20 330", "20 230"], ["Prix moyen par chambre (€)", "138,71", "139,72"], ["Indice de fréquentation", "1,62", {"a": 1.62, "tol": 0.006}], ["Nombre de petits déjeuners", "7 500", "7 061"], ["Taux de captage (%)", "36,90", {"a": 34.9, "tol": 0.06}], ["REVPAR (hors taxes, €)", "115,71", {"a": 116.28, "tol": 0.02}], ["TREVPAR (hors taxes, €)", "122,00", "non communiqué"]]}, "h": ["Taux d’occupation = louées ÷ disponibles ; indice = nuitées ÷ louées ; captage = petits déjeuners ÷ nuitées ; RevPAR = taux d’occupation × prix moyen.", "Taux d’occupation : 12 488 ÷ 15 006 = 83,22 %. Indice : 20 230 ÷ 12 488 = 1,62. Captage : 7 061 ÷ 20 230 = 34,9 %. RevPAR : 0,8322 × 139,72 = 116,28 €."], "m": "Taux d’occupation, indice de fréquentation, taux de captage et RevPAR se calculent à partir des mêmes données."}, {"c": 5, "p": "2.2.3", "s": "Grand Horizon", "t": "q", "q": "<b>Nina</b> (revenue manager) : Comparez N et N-1. Que dire du RevPAR, qui était de 115,71 € en N-1 ?", "o": ["On ne peut pas conclure sans le TREVPAR", "Il augmente : la hausse du prix moyen compense la légère baisse du taux d’occupation", "Il est identique", "Il baisse, car le taux d’occupation recule"], "k": 1, "g": "Pas tout à fait. Comparez 116,28 € (N) et 115,71 € (N-1).", "h": ["Comparez 116,28 € (N) et 115,71 € (N-1).", "RevPAR N = 116,28 € contre 115,71 € : environ +0,5 %. Le prix moyen (+1,01 €) compense la baisse du taux d’occupation (−0,20 point)."], "m": "Le RevPAR combine taux d’occupation et prix moyen."}, {"c": 5, "p": "2.2.3", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : En N-1, le TREVPAR est de 122,00 € et le RevPAR de 115,71 €. Quel chiffre d’affaires hors hébergement (restauration, spa…) par chambre disponible cela représente-t-il (en €) ?", "a": 6.29, "tol": 0.01, "w": [], "g": "Pas tout à fait. Le TREVPAR prend en compte tous les revenus, pas seulement l’hébergement.", "h": ["Le TREVPAR prend en compte tous les revenus, pas seulement l’hébergement.", "122,00 − 115,71 = 6,29 € par chambre disponible, soit environ 94 400 € sur l’année (6,29 × 15 006)."], "m": "TREVPAR = CA total ÷ chambres disponibles ; il intègre restauration, spa, etc."}, {"c": 5, "p": "2.2.4", "s": "Grand Horizon", "t": "t", "q": "<b>Nina</b> (revenue manager) : Comparons N-1 et N pour l’hôtel. Complétez la colonne « Évolution » : en % pour un montant ou un volume, en points pour un taux.", "tbl": {"head": ["Indicateur", "N-1", "N", "Évolution"], "rows": [["Chambres louées", "12 518", "12 488", {"a": -0.24, "tol": 0.02, "u": "%"}], ["Taux d’occupation (%)", "83,42", "83,22", {"a": -0.2, "tol": 0.02, "u": "points"}], ["Prix moyen par chambre (€)", "138,71", "139,72", {"a": 0.73, "tol": 0.02, "u": "%"}], ["REVPAR hors taxes (€)", "115,71", "116,28", {"a": 0.49, "tol": 0.02, "u": "%"}], ["Taux de captage (%)", "36,90", "34,90", {"a": -2.0, "tol": 0.05, "u": "points"}]]}, "h": ["Évolution en % = (N − N-1) ÷ N-1 × 100 ; pour un taux, N − N-1 en points. Le signe compte !", "Chambres louées : (12 488 − 12 518) ÷ 12 518 = −0,24 %. Taux d’occupation : 83,22 − 83,42 = −0,20 point. Prix moyen : 1,01 ÷ 138,71 = +0,73 %. RevPAR : 0,57 ÷ 115,71 = +0,49 %. Taux de captage : 34,90 − 36,90 = −2 points."], "m": "Montant ou volume : évolution en %. Taux : écart en points."}, {"c": 5, "p": "2.2.4", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : Le chiffre d’affaires hébergement HT est égal aux chambres louées × le prix moyen : en N-1, 12 518 × 138,71 € ; en N, 12 488 × 139,72 €. Quelle est l’évolution du CA hébergement HT (en %, arrondie au centième) ?", "a": 0.49, "tol": 0.02, "w": [], "g": "Pas tout à fait. Calculez les deux chiffres d’affaires, puis (N − N-1) ÷ N-1.", "h": ["Calculez les deux chiffres d’affaires, puis (N − N-1) ÷ N-1.", "N-1 : 12 518 × 138,71 = 1 736 371,78 € ; N : 12 488 × 139,72 = 1 744 823,36 €. Évolution = 8 451,58 ÷ 1 736 371,78 = +0,49 %, comme le RevPAR (même nombre de chambres disponibles)."], "m": "CA hébergement = chambres louées × prix moyen."}, {"c": 5, "p": "2.2.1", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : Le CA hébergement HT de N est de 1 744 823 € pour 12 488 chambres louées. Quel est le prix moyen par chambre (en €, arrondi au centime) ?", "a": 139.72, "tol": 0.02, "w": [], "g": "Pas tout à fait. Prix moyen = CA hébergement ÷ chambres louées.", "h": ["Prix moyen = CA hébergement ÷ chambres louées.", "1 744 823 ÷ 12 488 = 139,72 €."], "m": "Prix moyen = CA hébergement ÷ chambres louées."}, {"c": 5, "p": "2.2.3", "s": "Grand Horizon", "t": "n", "q": "<b>Nina</b> (revenue manager) : Le chiffre d’affaires total HT de l’hôtel en N (hébergement, restauration, spa…) est de 1 840 000 €, pour 15 006 chambres disponibles. Quel est le TREVPAR (en €, arrondi au centime) ?", "a": 122.62, "tol": 0.02, "w": [], "g": "Pas tout à fait. TREVPAR = CA total ÷ chambres disponibles.", "h": ["TREVPAR = CA total ÷ chambres disponibles.", "1 840 000 ÷ 15 006 = 122,62 €. Il dépasse le RevPAR (116,28 €) car il intègre les autres recettes (environ 6,34 € par chambre disponible)."], "m": "TREVPAR = CA total ÷ chambres disponibles."}, {"c": 5, "p": "2.2.5", "s": "Grand Horizon", "t": "r", "q": "<b>Nina</b> (revenue manager) : ✍️ <b>Analysez</b> l’évolution des indicateurs commerciaux de l’hôtel entre N-1 et N : taux d’occupation de 83,42 % à 83,22 %, prix moyen de 138,71 € à 139,72 €, RevPAR de 115,71 € à 116,28 €, taux de captage de 36,90 % à 34,90 %. Que conclure et que proposer ? (4 à 6 phrases)", "crit": [["Évoque le taux d’occupation", "(occupation)"], ["Évoque le prix moyen", "(prix moyen)"], ["Conclut sur le RevPAR", "(revpar)"], ["Cite le taux de captage ou les petits déjeuners", "(captage|petit|dejeuner)"], ["Propose une action commerciale", "(action|propos|recommand|promotion|offre|vendre|formule|sensibilis|relanc)"]], "model": "Le taux d’occupation recule légèrement (83,42 % à 83,22 %, soit −0,20 point), mais le prix moyen progresse de 0,73 %, ce qui fait monter le RevPAR de 0,49 % (116,28 €). En revanche, le taux de captage baisse de 2 points (34,9 %) : moins de clients prennent le petit déjeuner. Je propose de poursuivre la politique tarifaire tout en relançant la vente de petits déjeuners, par exemple avec une formule incluse à la réservation.", "h": ["Opposez le recul du taux d’occupation à la hausse du prix moyen, puis regardez le RevPAR et le petit déjeuner.", "Un bon commentaire : constat chiffré, explication, recommandation."], "m": "Analyse = constat chiffré + causes + recommandation."}, {"c": 6, "p": "4.2.1", "s": "Grand Horizon", "t": "q", "q": "<b>Thomas</b> (chef de réception) : Quel est le bon ordre des étapes du process de vente à la réception ?", "o": ["Découverte des besoins → conclusion → accueil → traitement des objections", "Argumentation → accueil → conclusion → découverte des besoins", "Conclusion → accueil → découverte des besoins → argumentation", "Accueil → découverte des besoins → argumentation → traitement des objections → conclusion"], "k": 3, "g": "Pas tout à fait. On accueille avant de poser des questions, et on conclut en dernier.", "h": ["On accueille avant de poser des questions, et on conclut en dernier.", "Accueil, découverte des besoins (questions, reformulation), argumentation, traitement des objections, conclusion, puis prise de congé et fidélisation."], "m": "Accueil → découverte → argumentation → objections → conclusion."}, {"c": 6, "p": "4.2.2", "s": "Grand Horizon", "t": "n", "q": "<b>Thomas</b> (chef de réception) : Un soir, 4 clients ayant réservé ne se présentent pas et n’ont pas annulé (no-show). Prix moyen de la chambre : 100 € HT. L’hôtel conserve 30 € d’arrhes par réservation et n’a pas pu relouer les chambres. Quel est le manque à gagner net (en €) ?", "a": 280.0, "tol": 1.0, "w": [], "g": "Pas tout à fait. Manque à gagner brut = 4 chambres × 100 € ; retirez les arrhes conservées.", "h": ["Manque à gagner brut = 4 chambres × 100 € ; retirez les arrhes conservées.", "4 × 100 = 400 € de manque à gagner brut ; 4 × 30 = 120 € d’arrhes conservées ; 400 − 120 = 280 €. Prévention : garantie de réservation (carte bancaire, arrhes), rappel avant l’arrivée."], "m": "No-show : manque à gagner = chambres perdues × prix moyen − sommes conservées."}, {"c": 6, "p": "4.2.1", "s": "Grand Horizon", "t": "q", "q": "<b>Thomas</b> (chef de réception) : Pendant l’entretien de vente, un client dit : « C’est trop cher pour ce que c’est ». À quelle étape du process de vente correspond la réponse du réceptionniste ?", "o": ["Le traitement des objections", "L’accueil", "La découverte des besoins", "La prise de congé"], "k": 0, "g": "Pas tout à fait. Le client exprime un frein à l’achat.", "h": ["Le client exprime un frein à l’achat.", "Traitement des objections : on écoute, on reformule, puis on répond avec des arguments (qualité, services inclus, comparaison) avant de conclure."], "m": "Objection = frein exprimé par le client ; on la traite avant de conclure."}, {"c": 6, "p": "4.2.2", "s": "Grand Horizon", "t": "n", "q": "<b>Thomas</b> (chef de réception) : Sur 120 réservations pour la soirée, 6 clients ne se présentent pas. Quel est le taux de no-show (en %) ?", "a": 5.0, "tol": 0.05, "w": [], "g": "Pas tout à fait. Taux de no-show = no-shows ÷ réservations × 100.", "h": ["Taux de no-show = no-shows ÷ réservations × 100.", "6 ÷ 120 × 100 = 5 %."], "m": "Taux de no-show = no-shows ÷ réservations × 100."}, {"c": 7, "p": "2.1.1", "s": "Grand Horizon", "t": "n", "q": "<b>M. Valmont</b> (directeur général) : Le coût d’occupation de l’hôtel est de 180 000 € par an, pour 12 000 nuitées vendues. Quel est le coût d’occupation par nuitée (en €) ?", "a": 15.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. Coût d’occupation annuel ÷ nuitées vendues.", "h": ["Coût d’occupation annuel ÷ nuitées vendues.", "180 000 ÷ 12 000 = 15 € par nuitée."], "m": "Coût d’occupation par nuitée = coût annuel ÷ nuitées vendues."}, {"c": 7, "p": "1.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>M. Valmont</b> (directeur général) : Coût de revient d’une nuitée : coût d’occupation 15 € + personnel 28 € + autres charges 12 € = 55 €. Avec une marge de 40 % sur le coût de revient, quel est le prix de vente HT d’une nuitée (en €) ?", "a": 77.0, "tol": 0.01, "w": [], "g": "Pas tout à fait. Prix HT = coût de revient × (1 + taux de marge).", "h": ["Prix HT = coût de revient × (1 + taux de marge).", "55 × 1,40 = 77 € HT (soit 84,70 € TTC avec une TVA à 10 %)."], "m": "Prix HT = coût de revient × (1 + taux de marge)."}, {"c": 7, "p": "1.1.3", "s": "Grand Horizon", "t": "n", "q": "<b>M. Valmont</b> (directeur général) : Une nuitée est vendue 77 € HT, avec une TVA à 10 % sur l’hébergement. Quel prix TTC le client paie-t-il (en €) ?", "a": 84.7, "tol": 0.01, "w": [], "g": "Pas tout à fait. TTC = HT × (1 + taux de TVA).", "h": ["TTC = HT × (1 + taux de TVA).", "77 × 1,10 = 84,70 € TTC."], "m": "TTC = HT × (1 + TVA)."}, {"c": 7, "p": "1.1.2", "s": "Grand Horizon", "t": "n", "q": "<b>M. Valmont</b> (directeur général) : L’hôtel vend 12 000 nuitées à 77 € HT, pour un coût de revient de 55 € la nuitée. Quelle est la marge totale annuelle (en €) ?", "a": 264000.0, "tol": 1.0, "w": [], "g": "Pas tout à fait. Marge unitaire × nombre de nuitées.", "h": ["Marge unitaire × nombre de nuitées.", "(77 − 55) × 12 000 = 22 × 12 000 = 264 000 €."], "m": "Marge totale = (prix − coût de revient) × quantité."}, {"c": 7, "p": "3.1.2,1.1.2", "s": "Grand Horizon", "t": "r", "q": "✍️ <b>Recommandez</b> à M. Valmont un prix : la concurrence affiche 70 € HT pour une prestation équivalente, notre coût de revient est de 55 € et notre objectif de marge de 40 % donne 77 € HT. Que décidez-vous ? (3 à 5 phrases)", "crit": [["Compare les prix (70 €, 77 €, 55 €)", "(70|77|55|concurren)"], ["Calcule ou cite la marge", "(marge|rentab|seuil|plancher)"], ["Évoque le positionnement, la qualité ou la demande", "(positionnement|qualit|demande|image|clientele|segment)"], ["Conclut par une recommandation claire", "(recommande|conseille|choisir|prefer|opter|fixer)"]], "model": "À 70 € HT, la marge est de 15 € par nuitée (27 % du coût de revient de 55 €), positive mais inférieure à l’objectif de 40 %. À 77 € HT, l’objectif est atteint mais l’hôtel se place 10 % au-dessus de la concurrence. Je recommande 77 € si notre positionnement et la qualité de service le justifient, sinon 70 € en misant sur un meilleur taux d’occupation.", "h": ["Comparez 70 € et 77 € à notre coût de revient de 55 €.", "Pensez à la marge, puis au positionnement et à la qualité."], "m": "Un prix se justifie par des chiffres, un positionnement et une conclusion."}];
var TH=[["1", "Les bases du prix de vente"], ["2", "Du coût au prix et à l’activité"], ["3", "Choisir et justifier un prix"], ["4", "Sécuriser et conclure la vente"], ["5", "Le contrat d’hôtellerie"]];

function toHub(m){if(s.walking)return;if(m)me("Retour au hall");s.sess="room";s.who=OC;s.loc=-1;sys("🚶 Vous retournez dans le <b>hall</b> avec Octave");s.scr="hub";say(allDone()?"Toutes les salles sont validées ! Il ne reste que le <b>Dossier final</b> 🗂️ pour ouvrir le coffre.":R(HB),OC);var w=weak().length;if(w>=3&&!allDone())say("💡 Conseil : "+w+" énigmes sont à revoir. Un petit <b>🔁 Défi révision</b> fixera ces notions !",OC);act();s.walking=1;walk(-1,function(){s.walking=0;if(s.nq!=null){var q=s.nq;s.nq=null;openC(q)}})}
function openC(k){if(s.walking){s.nq=k;return}s.nq=null;s.sess="room";var p0=P[k];me("Direction : "+p0.e+" "+p0.l);s.walking=1;sys("🚶 Vous vous dirigez vers <b>"+p0.l+"</b>…");walk(k,function(){s.walking=0;s.loc=k;s.who=k;sys("🚪 Vous entrez : <b>"+p0.l+"</b> – "+p0.n+", "+p0.r);if(!s.v[k]){s.v[k]=1;say(p0.i)}else say("Ravi(e) de vous revoir ! Reprenons.");var n=nd(k);if(!n.length){say("Cette salle est déjà validée ! Voici ma fiche de rappel :");showFiche(k);toHub();return}s.cur=n[0];ask()})}
function ask(){var q=Q[s.cur],ids=idx(q.c),tag=s.sess==="rev"?'🔁 Révision '+(s.pos+1)+'/'+s.list.length:s.sess==="boss"?'🗂️ Dossier '+(s.pos+1)+'/'+s.list.length:'Énigme '+(ids.indexOf(s.cur)+1)+'/'+ids.length;s.ah=0;s.ae=0;say('<span class="chip">📄 '+q.s+'</span><span class="chip">'+tag+'</span><span class="chip">🎓 '+q.p.split(",")[0]+'</span>'+(q.t==="r"?'<span class="chip">✍️ Rédaction</span>':'')+(q.t==="t"?'<span class="chip">📋 Tableau à compléter</span>':'')+'<br>'+q.q+(q.t==="t"?tblHtml(q):"")+(q.img?'<br><img class="doc" src="'+q.img+'" alt="Document à analyser" onclick="this.classList.toggle(\'zoom\')">':''));s.qt=Date.now();s.scr="play";act()}
function roomClose(k){if(nd(k).length)return false;say("🏅 <b>Salle validée : "+C[k][1]+"</b> – chiffre du code : <b>"+C[k][3]+"</b>");fx();award("c"+k);var ids=idx(k);if(ids.every(function(j){return !(s.h[j]||0)}))award("nh");if(ids.every(function(j){return !(s.e[j]||0)}))award("nf");say(P[k].f);showFiche(k);say(roomCmp(k));return true}
function afterGood(q){say(cmpCard(q));say('<div class="memo"><b>À retenir :</b> '+q.m+'</div>');var done=roomClose(q.c),l=lvl();if(l>s.lv){s.lv=l;say("🎖️ <b>Promotion !</b> Vous devenez <b>"+LV[l][0]+"</b> "+LV[l][2],OC);fx();beep("bd")}s.nl=done?"":"Énigme suivante →";s.scr=done?"conf":"fb";upd();sv();act()}
function good(){var i=s.cur,q=Q[i];if(s.sess!=="room"){goodS();return}var hh=s.h[i]||0,ee=s.e[i]||0,g=Math.max(20,100-20*hh-25*ee),clean=!hh&&!ee,b=clean?10*Math.min(s.st,5):0,sp=clean&&(Date.now()-s.qt)/1000<20?10:0;if(clean)s.st++;else s.st=0;s.xp+=g+b+sp;s.d[i]=1;s.q[i]=clean?1:2;beep("ok");
say(R(P[q.c].pr)+" <b>+"+g+" pts</b>"+(b?" (+"+b+" bonus de série 🔥)":"")+(sp?" (+10 rapidité ⚡)":""));if(sp)award("fast");if(clean&&s.st>=5)award("s5");afterGood(q)}
function goodR(ratio){var i=s.cur,q=Q[i],g=Math.max(20,Math.round(100*ratio));s.xp+=g;s.d[i]=1;s.q[i]=ratio>=.6?1:2;if(ratio>=.6)s.st++;else s.st=0;beep("ok");say((ratio>=.6?R(P[q.c].pr):"Bon début, mais il manque encore des éléments : comparez avec le modèle.")+" <b>+"+g+" pts</b>");if(ratio>=.8)award("wr");afterGood(q)}
function goodS(){var i=s.cur,q=Q[i],clean=!s.ah&&!s.ae,g;if(s.sess==="boss"){g=60;s.sok++;s.q[i]=1}else{g=clean?40:15;if(clean){s.q[i]=1;s.sok++}else if(s.q[i]!==1)s.q[i]=2}s.xp+=g;if(clean)s.st++;else s.st=0;beep("ok");say(R(P[q.c].pr)+" <b>+"+g+" pts</b>"+(s.sess==="rev"&&clean?" · notion marquée 🟩 maîtrisée":""));say(cmpCard(q));say('<div class="memo"><b>À retenir :</b> '+q.m+'</div>');var l=lvl();if(l>s.lv){s.lv=l;say("🎖️ <b>Promotion !</b> Vous devenez <b>"+LV[l][0]+"</b> "+LV[l][2],OC);fx();beep("bd")}s.nl="Suite →";s.scr="fb";upd();sv();act()}
function next(){if(s.sess!=="room"){s.pos++;if(s.pos<s.list.length){s.cur=s.list[s.pos];ask()}else endSess();return}var k=Q[s.cur].c,n=nd(k);if(n.length){s.cur=n[0];ask()}else toHub()}
function wrong(m){var i=s.cur,q=Q[i];if(s.sess==="boss"){s.e[i]=(s.e[i]||0)+1;if(s.q[i]!==1)s.q[i]=s.q[i]||2;s.st=0;beep("ko");say("❌ Réponse incorrecte. "+(q.t==="n"?"Attendu : <b>"+q.a+"</b>. ":q.t==="q"?"Attendu : <b>"+q.o[q.k]+"</b>. ":q.t==="t"?"Attendu : "+tAns(q)+". ":"")+m);say('<div class="memo"><b>À retenir :</b> '+q.m+'</div>');s.nl="Suite →";s.scr="fb";sv();act();return}
s.e[i]=(s.e[i]||0)+1;s.ae++;s.st=0;pay(PEN);beep("ko");say((R(P[q.c].oo)+TP()).replace(/[.…]+\s*$/,"")+". "+m+(s.ae>=2&&q.t!=="r"?" Besoin d’aide ? Vous pouvez demander la <b>correction</b> ci-dessous.":""));if(s.e[i]===1)say("📖 Bonne nouvelle : le <b>cours</b> est maintenant débloqué pour cette énigme. Touchez « Cours » pour revoir la notion avant de réessayer.",OC);upd();sv();act();if(s.t<=0)over()}
function hint(){if(s.sess==="boss")return;var i=s.cur,h=s.h[i]||0;me("💡 Un indice, Octave !");if(h>=2){say("Je n’ai plus d’indice pour cette énigme, mais je crois en vous !");return}s.h[i]=h+1;s.ah++;s.st=0;pay(PEN);say("💡 "+Q[i].h[h]+(s.mode==="train"?"":' <span class="mu">(-'+pl()+')</span>'));upd();sv();if(s.t<=0)over()}
function cours(){if(!(s.e[s.cur]>=1)){say("📖 Le cours se débloque après une première erreur : essayez d’abord seul(e) !",OC);return}var k=Q[s.cur].c;me("📖 Un rappel de cours, s’il vous plaît");pay(Math.round(PEN*.6));showFiche(k,OC);if(s.mode!=="train")say("Fiche affichée <span class=\"mu\">(-"+Math.round(PEN*.6)+" s)</span>.",OC);upd();sv();if(s.t<=0)over()}
function giveUp(){var i=s.cur,q=Q[i];me("🏳️ Je veux voir la correction");say("Voici la correction : <b>"+(q.t==="n"?q.a:q.t==="t"?tAns(q):q.o[q.k])+"</b>. "+q.h[1]);say('<div class="memo"><b>À retenir :</b> '+q.m+'</div>');say(cmpCard(q));say("Pas de panique : cette notion est notée « à revoir » 🟥 et reviendra dans votre 🔁 Défi révision.");s.q[i]=3;s.st=0;if(s.sess==="room"){s.d[i]=1;var done=roomClose(q.c);s.nl=done?"":"Énigme suivante →";s.scr=done?"conf":"fb"}else{s.nl="Suite →";s.scr="fb"}upd();sv();act()}
function conf(v){var k=Q[s.cur].c,L=["","😕 Encore fragile","🙂 À peu près sûr(e)","😎 Très à l’aise"],ids=idx(k),cl=ids.filter(function(j){return s.q[j]===1}).length,pc=Math.round(100*cl/ids.length);me(L[v]);s.conf[k]=v;say(v===3&&pc<50?"Attention : vous vous sentez très à l’aise, mais seulement <b>"+pc+" %</b> de vos réponses étaient réussies du premier coup. Un passage par le 🔁 Défi révision s’impose !":v===1&&pc>=70?"Vous êtes meilleur(e) que vous ne le pensez : <b>"+pc+" %</b> de réussite du premier coup. Confiance !":"Votre ressenti correspond à vos résultats (<b>"+pc+" %</b> réussies du premier coup). Bien joué !",k);sv();toHub()}
function pickO(k){var q=Q[s.cur];me(q.o[k]);if(k===q.k)good();else wrong(q.g)}
function check(){var q=Q[s.cur],raw=document.getElementById("ans").value,v=ev(raw);
if(isNaN(v)){say("Je n’ai pas compris : entrez un nombre ou un calcul, par exemple <i>12,5</i> ou <i>26*0,5</i>.");return}
me(esc(raw)+(/[+*\/()]|.-./.test(raw)?" = "+(Math.round(v*100)/100):""));if(Math.abs(v-q.a)<=q.tol){good();return}
var e=q.g;for(var k=0;k<q.w.length;k++){if(Math.abs(v-q.w[k][0])<=q.tol){e=q.w[k][1];break}}wrong(e)}
function submitR(){var q=Q[s.cur],t=document.getElementById("ans").value;if(t.trim().split(/\s+/).length<15){say("Développez un peu plus (au moins 15 mots) : appuyez-vous sur les chiffres de l’énoncé et terminez par une conclusion.");return}me(esc(t).replace(/\n/g,"<br>"));var n=norm(t),f=q.crit.map(function(c){return new RegExp(c[1],"i").test(n)}),ok=f.filter(Boolean).length,ratio=ok/q.crit.length;say('✍️ <b>Critères repérés dans votre réponse</b> <span class="mu">(détection automatique, indicative)</span><ul>'+q.crit.map(function(c,j){return "<li>"+(f[j]?"✅":"⬜")+" "+c[0]+"</li>"}).join("")+"</ul>");say("📝 <b>Réponse modèle</b> : "+q.model);goodR(ratio)}
function startList(t,list,intro){s.sess=t;s.list=list;s.pos=0;s.sok=0;s.cur=list[0];s.who=OC;say(intro,OC);ask()}
function startRev(){if(s.walking)return;me("🔁 Défi révision");var w=weak();if(!w.length){say("Rien à réviser pour l’instant : tout ce que vous avez terminé est <b>maîtrisé</b> 🟩 ! Terminez d’autres salles, ou revenez demain pour un rappel espacé.",OC);return}w=shuf(w).slice(0,6);startList("rev",w,"🔁 <b>Défi révision</b> : "+w.length+" énigme(s) à retravailler, mélangées. Réussissez-les du premier coup pour les marquer 🟩 « maîtrisées » !")}
function startBoss(){if(s.walking)return;me("🗂️ Dossier final du Directeur Général");var rooms=C.map(function(c,k){return k}).sort(function(a,b){return idx(b).filter(function(j){return s.q[j]!==1}).length-idx(a).filter(function(j){return s.q[j]!==1}).length}).slice(0,6),pick=[];rooms.forEach(function(k){var ids=idx(k).filter(function(j){return Q[j].t!=="r"}),wk=ids.filter(function(j){return s.q[j]!==1});pick.push(R(wk.length?wk:ids))});startList("boss",shuf(pick),"🗂️ <b>Dossier final du Directeur Général</b> : 6 questions mélangées issues de vos points faibles, <b>une seule tentative, sans indice</b>. Il faut <b>4 bonnes réponses</b> pour ouvrir le coffre. Respirez, relisez bien chaque énoncé !")}
function endSess(){var t=s.sess,n=s.list.length,ok=s.sok;s.sess="room";s.who=OC;if(t==="boss"){if(ok>=4){say("🎓 <b>Dossier réussi : "+ok+"/"+n+"</b> ! Le coffre est à vous.",OC);award("boss");finish();return}say("Dossier non validé : <b>"+ok+"/"+n+"</b> (4 requis). Révisez les notions manquées avec le 🔁 Défi révision ou les fiches, puis retentez le dossier.",OC);toHub();return}say("🔁 Défi terminé : <b>"+ok+"/"+n+"</b> réussies du premier coup. "+(ok===n?"Bravo, tout est maîtrisé !":"Les autres restent à revoir : refaites un défi ou consultez les fiches."),OC);award("rev");toHub()}
function finish(){clearInterval(s.tm);s.who=OC;s.sess="room";s.scr="end";clr();var ft=0;Q.forEach(function(q,i){if(s.q[i]===1)ft++});var rk=LV[lvl()][0]+" "+LV[lvl()][2],ic=["⬜","🟥","🟨","🟩"],nc=CP.filter(function(c){return capSt(c.split("|")[0])===3}).length,wk=CP.filter(function(c){var st=capSt(c.split("|")[0]);return st===1||st===2});
me("Ouvrons le coffre !");sys("🎉 Toute l’équipe est réunie : "+P.slice(0,8).map(function(p){return p.e}).join(" ")+" applaudit !");say((s.name?"Bravo <b>"+esc(s.name)+"</b> ! ":"")+"🔓 <b>Clic !</b> Le code était <b>"+C.map(function(c){return c[3]}).join(" – ")+"</b>. Les clés des suites et le plan d’accueil sont à vous"+(s.mode==="train"?" !":", avec <b>"+fmt(s.t)+"</b> d’avance !"));
say("Votre rang : <b>"+rk+"</b> – "+s.xp+" pts, "+ft+"/"+Q.length+" énigmes réussies du premier coup, <b>"+nc+"/"+CP.length+" capacités maîtrisées</b> 🟩.");
say(wk.length?"🧭 <b>Plan de révision</b> : "+wk.length+" capacité(s) à consolider<ul>"+wk.map(function(c){var p=c.split("|");return "<li>"+ic[capSt(p[0])]+" "+p[0]+" – "+p[1]+"</li>"}).join("")+"</ul>Utilisez les fiches, puis votre 📄 bilan pour le partager avec votre enseignant.":"🧭 Toutes les capacités sont maîtrisées : parcours exemplaire !",OC);
say(basesHtml(),OC);say("🏆 Badges gagnés : "+Object.keys(s.b).length+"/"+BD.length+" "+BD.filter(function(b){return s.b[b[0]]}).map(function(b){return b[1]}).join(" "),OC);fx();beep("bd");act()}
start();
</script></body></html>
